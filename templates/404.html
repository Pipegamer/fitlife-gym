{% extends 'base.html' %}

{% block title %}404 - Ruta Fuera de Forma{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full bg-white p-10 rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/50 text-center space-y-6">
        <div class="w-20 h-20 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto text-4xl font-black">
            <i class="bi bi-activity"></i>
        </div>
        <div class="space-y-2">
            <span class="text-xs font-bold uppercase tracking-widest text-emerald-600">Error 404</span>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">¡Upps! Esta ruta se tomó un día de descanso</h1>
            <p class="text-sm text-slate-500 leading-relaxed">
                El enlace consultado no existe en FitLife:
            </p>
            {% if ruta %}
                <code class="block bg-slate-100 p-2 rounded-lg text-xs font-mono text-slate-700">/{{ ruta }}</code>
            {% endif %}
        </div>
        <a href="{% url 'home' %}" class="inline-flex items-center justify-center gap-2 w-full py-3.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all">
            <i class="bi bi-house-door-fill"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
